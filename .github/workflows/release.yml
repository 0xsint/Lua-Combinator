name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag matches info.json version
        run: |
          version=$(python3 -c "import json; print(json.load(open('info.json'))['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match info.json version $version" >&2
            exit 1
          fi

      - name: Run tests
        run: |
          pip install lupa
          python3 tests/run.py

      - name: Build mod zip
        run: python3 tools/build_zip.py

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
